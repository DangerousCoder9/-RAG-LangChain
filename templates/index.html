<!DOCTYPE html>
<html>
<head>
    <title>AI GitHub Assistant</title>

    <style>
        body {
            font-family: Arial;
            background: #0f172a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .box {
            background: #1e293b;
            padding: 30px;
            border-radius: 10px;
            width: 500px;
        }

        input {
            width: 70%;
            padding: 10px;
        }

        button {
            padding: 10px;
            background: blue;
            color: white;
            border: none;
        }

        .answer {
            margin-top: 20px;
            background: #334155;
            padding: 10px;
            border-radius: 5px;
        }
    </style>

</head>
<body>

<div class="box">
    <h2>Ask your AI</h2>

    <form method="POST">
        <input type="text" name="question" placeholder="Ask something..." required>
        <button type="submit">Ask</button>
    </form>

    {% if answer %}
        <div class="answer">
            <h3>Answer:</h3>
            <p style="white-space: pre-line;">{{ answer }}</p>
        </div>
    {% endif %}
</div>

</body>
</html>
